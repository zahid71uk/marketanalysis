spring.application.name=marketanalysis
server.port=${SERVER_PORT:8082}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
market-analysis.dataset-api-url=${DATASET_API_URL:http://127.0.0.1:8000}
market-analysis.estimator-api-url=${ESTIMATOR_API_URL:http://127.0.0.1:8001}
market-analysis.cache-ttl=${DATASET_CACHE_TTL:PT5M}
market-analysis.connect-timeout=${UPSTREAM_CONNECT_TIMEOUT:PT2S}
market-analysis.read-timeout=${UPSTREAM_READ_TIMEOUT:PT8S}